[project]
name = "datelier"
version = "0.1.0"
description = "A local desktop data inspection workbench for analysts"
readme = "README.md"
authors = [
    { name = "UmMDoGssS", email = "thuongduykhang@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[project.scripts]
datelier = "datelier:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.3.2",
    "pytest>=8.4",
    "ruff>=0.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
