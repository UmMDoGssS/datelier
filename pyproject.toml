[project]
name = "datelier"
version = "0.1.0"
description = "A local desktop data inspection workbench for analysts"
readme = "README.md"
authors = [
    { name = "UmMDoGssS", email = "thuongduykhang@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "imgui-bundle>=1.92.900",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "polars>=1.44.2",
    "pyyaml>=6.0.3,<7",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sounddevice>=0.5,<1",
    "soundfile>=0.13,<1",
    "threadpoolctl>=3.6.0",
    "tokenizers>=0.22,<1",
    "umap-learn>=0.5.12",
]

[project.optional-dependencies]
checkpoints = [
    "torch>=2.14.1; sys_platform == 'linux'",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu", extra = "checkpoints" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pyrefly]
search-path = ["src", ".", "tests"]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[project.scripts]
datelier = "datelier:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.3.2",
    "pytest>=8.4",
    "ruff>=0.13",
    "scipy-stubs>=1.18.1.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["datelier"]
